<script type="module">
const { THREE, Lab, MAT, GEO, clamp, lerp, approach, fmt, smoothstep } = window.LabKit

// ------------------------------------------------------------------ research (step 1)
// "HSB05: the hanger shot blast of the BC finishing line, moving the way it does in the Blender layout"
// The real machine: a hook (hanger) type shot blast, Q37-style, sized for a 4-cylinder cast iron block, with two
// doors like HSB06: the block goes in through the left door and comes out through the right one.
// Dimensions (m), read off the user's Blender layout (1 unit = 0.1 m): octagonal chamber 3.4 across flats,
// 2.8 high on a 0.3 plinth, two doors 1.1 x 2.0 on the faces 45 degrees either side of the front with the
// control panel on the face between them, monorail underside at 2.35, roller conveyor top 0.80,
// BC block 0.475 x 0.336 x 0.371 (L x H x W), about 36 kg.
// Parts: plinth, 6 wall panels + corner posts, two door faces (jambs, header split for the rail, yellow
// posts, two leaves each), roof, round lid with hub and lifting eyes, 4 blast wheels (housing, 8-blade
// impeller, motor), floor grating, V-shaped monorail (an I-beam leg out through each door, a hanger post at
// the centre, a portal at each outer end), trolley, electric hoist, wire ropes, hook block, C-hook hanger,
// the block, in and out roller conveyors, bucket elevator, separator, dust collector with duct, control
// panel, stack light.
// Physics: wheel tip speed v = pi D n / 60 (D 0.48 m); shot flow 2.5 kg/s per wheel (S330, d 0.84 mm,
// 7,600 kg/m3); wheel power P = m v^2 / (2 eta) with eta 0.6 (about 11 kW each at 2,900 rpm);
// dent diameter d_d = 0.24 mm (v / 72 m/s)^0.4; coverage (Avrami) C = 1 - exp(-k t) with
// k = f_hit (m_dot / m_shot) (pi d_d^2 / 4) / A_block; f_hit 0.25, A_block 0.92 m2.
// Hero: coverage, %. Input: wheel speed. Break: a blade leaves a wheel; imbalance F = m r w^2,
// the wheel trips on vibration and the other three finish the cycle.

const lab = new Lab({
  prompt: 'HSB05: the hanger shot blast of the BC line, moving the way it does in the Blender layout',
  no: 5, title: 'HSB05', sub: 'hanger shot blast',
  size: 5.4,
  view: { az: 0, el: 20, dist: 2.6, target: [0, 1.3, 1.3], fov: 30 },
  cut: { a: [0, 0, 1], b: [0, 1, 0], center: [0, 1.35, 0], reach: 0.6 },
  pills: ['three.js', 'Shot blast', 'Avrami'],
})

// ------------------------------------------------------------------ dimensions
const AP = 1.7                               // apothem: wall panels sit at this distance
const SIDE = 2 * AP * Math.tan(Math.PI / 8)  // 1.408 m wall width
const RV = AP / Math.cos(Math.PI / 8)        // corner radius
const BASE = 0.3                             // plinth top / chamber floor
const H = 2.8                                // wall height
const TOP = BASE + H
const DOOR_W = 1.1, DOOR_H = 2.0
const RAIL_Y = 2.35                          // underside of the monorail bottom flange
const CONV_Y = 0.8                           // roller tops
const Z_OUT = 3.05                           // trolley station over each conveyor, along its leg
const BLOCK = [0.475, 0.336, 0.371]
const DECK_LOW = CONV_Y - 0.07, DECK_HIGH = DECK_LOW + 0.46   // low: the tines sit between the rollers
// a wall at angle t (0 = facing +z, the front) has outward normal (sin t, 0, cos t)
const nrm = (t) => [Math.sin(t), 0, Math.cos(t)]
// the two doors and the monorail legs through them: in on the left, out on the right, as angles off +z
const LEGS = [-Math.PI / 4, Math.PI / 4]
// a point (x across, z along) in a leg's frame, in the world
const W = (a, x, z) => [x * Math.cos(a) + z * Math.sin(a), -x * Math.sin(a) + z * Math.cos(a)]

// ------------------------------------------------------------------ materials
const beige = MAT.paint({ color: [0.78, 0.72, 0.6], roughness: 0.45, clearcoat: 0.25 })
const beigeDark = MAT.paint({ color: [0.62, 0.57, 0.47], roughness: 0.5, clearcoat: 0.2 })
const yellow = MAT.paint({ color: [0.86, 0.72, 0.1], roughness: 0.36, clearcoat: 0.5 })
const lidGrey = MAT.paint({ color: [0.3, 0.31, 0.32], roughness: 0.5, clearcoat: 0.2 })
const steel = MAT.steel()
const steelDark = MAT.steelDark()
const rubber = MAT.rubber()
const grating = MAT.steelDark({ roughness: 0.6 })
const blockMat = MAT.castIron({ color: [0.24, 0.2, 0.17], roughness: 0.8 }) // raw casting, rust brown; brightens with coverage
blockMat.transparent = true

// ------------------------------------------------------------------ plinth, walls, roof, lid
lab.mesh(GEO.lathe([[0, 0], [RV + 0.12, 0], [RV + 0.12, BASE], [0, BASE]], 8, { phi0: Math.PI / 8 }), steelDark, { name: 'Plinth', explode: [0, -0.2, 0] })
for (const i of [0, 2, 3, 4, 5, 6]) {
  const t = (i * Math.PI) / 4 // i = 1 and 7 are the door faces, built below
  const [nx, , nz] = nrm(t)
  lab.mesh(GEO.rbox(SIDE, H, 0.06, 0.012), beige, {
    name: `Wall ${i}`, pos: [nx * AP, BASE + H / 2, nz * AP], rot: [0, t, 0],
    explode: [nx * 0.9, 0, nz * 0.9], xray: 'shell',
  })
  // two horizontal stiffeners on the outside of each panel
  for (const y of [BASE + 0.95, BASE + 1.9]) lab.mesh(GEO.rbox(SIDE * 0.96, 0.06, 0.05, 0.01), beigeDark, { name: 'Stiffener', pos: [nx * (AP + 0.055), y, nz * (AP + 0.055)], rot: [0, t, 0], explode: [nx * 0.9, 0, nz * 0.9], count: 1 })
}
for (let i = 0; i < 8; i++) {
  const a = Math.PI / 8 + (i * Math.PI) / 4
  lab.mesh(GEO.rbox(0.1, H + 0.04, 0.1, 0.015), beigeDark, { name: 'Corner post', pos: [Math.sin(a) * RV, BASE + H / 2, Math.cos(a) * RV], rot: [0, a, 0], explode: [Math.sin(a) * 0.9, 0, Math.cos(a) * 0.9], count: 1 })
}
// the two door faces: jambs, a header split by the rail slot, yellow posts and two leaves that swing out
const JAMB = (SIDE - DOOR_W) / 2
const leaves = []
LEGS.forEach((t, i) => {
  const g = new THREE.Group(); g.rotation.y = t
  const part = (geo, mat, x, y, z) => { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); g.add(m); return m }
  for (const s of [-1, 1]) {
    part(GEO.rbox(JAMB, DOOR_H, 0.06, 0.01), beige, s * (DOOR_W / 2 + JAMB / 2), BASE + DOOR_H / 2, AP)
    part(GEO.rbox(0.14, DOOR_H + 0.25, 0.16, 0.02), yellow, s * (DOOR_W / 2 + 0.07), BASE + (DOOR_H + 0.25) / 2, AP + 0.1)
    const hw = (SIDE - 0.18) / 2
    part(GEO.rbox(hw, H - DOOR_H, 0.06, 0.01), beige, s * (0.09 + hw / 2), BASE + DOOR_H + (H - DOOR_H) / 2, AP)
  }
  part(GEO.rbox(DOOR_W + 0.28, 0.14, 0.16, 0.02), yellow, 0, BASE + DOOR_H + 0.18, AP + 0.1)
  lab.add(g, { name: i ? 'Right door face (out)' : 'Left door face (in)', explode: [Math.sin(t) * 0.9, 0, Math.cos(t) * 0.9], xray: 'shell', count: 7, label: i ? 'Out door' : 'In door', at: [0, BASE + DOOR_H + 0.45, AP + 0.1] })
  // door leaves hinge on the outer edge of the opening and swing out
  for (const s of [-1, 1]) {
    const pivot = new THREE.Group(); pivot.position.set(s * DOOR_W / 2, BASE, AP + 0.04)
    const leaf = new THREE.Mesh(GEO.rbox(DOOR_W / 2 - 0.01, DOOR_H - 0.02, 0.05, 0.01), beige)
    leaf.position.set(-s * (DOOR_W / 4), DOOR_H / 2, 0.03)
    const handle = new THREE.Mesh(GEO.rbox(0.03, 0.22, 0.04, 0.01), steel); handle.position.set(-s * (DOOR_W / 2 - 0.08), DOOR_H * 0.52, 0.08)
    const seal = new THREE.Mesh(GEO.rbox(0.02, DOOR_H - 0.06, 0.03, 0.006), rubber); seal.position.set(-s * (DOOR_W / 2 - 0.02), DOOR_H / 2, 0.07)
    pivot.add(leaf, handle, seal)
    lab.add(pivot, { parent: g, name: 'Door leaf', explode: [s * 0.4, 0, 1.4], count: 3 })
    leaves.push({ pivot, s })
  }
})
// roof and the round lid
const oct = new THREE.Shape(Array.from({ length: 8 }, (_, i) => { const a = Math.PI / 8 + (i * Math.PI) / 4; return new THREE.Vector2(Math.sin(a) * (RV + 0.06), Math.cos(a) * (RV + 0.06)) }))
const roofGeo = GEO.extrude(oct, 0.1, 0.01); roofGeo.rotateX(-Math.PI / 2)
lab.mesh(roofGeo, MAT.paint({ color: [0.62, 0.57, 0.47], roughness: 0.5, clearcoat: 0.2 }), { name: 'Roof', pos: [0, TOP + 0.05, 0], explode: [0, 0.9, 0], xray: 'shell' })
lab.mesh(GEO.disc(1.25, 0.14), MAT.paint({ color: [0.3, 0.31, 0.32], roughness: 0.5, clearcoat: 0.2 }), { name: 'Lid', pos: [0, TOP + 0.17, 0], explode: [0, 1.3, 0], xray: 'shell' })
lab.mesh(GEO.disc(0.28, 0.12), lidGrey, { name: 'Lid hub', pos: [0, TOP + 0.3, 0], explode: [0, 1.5, 0] })
lab.mesh(GEO.bolts(12, 0.2, 0.018, 0.03, { y: 0 }), steel, { name: 'Hub bolts', pos: [0, TOP + 0.36, 0], explode: [0, 1.5, 0], count: 12 })
for (let i = 0; i < 3; i++) {
  const a = Math.PI / 3 + (i * 2 * Math.PI) / 3
  lab.mesh(GEO.tube(0.05, 0.03, 0.02), steel, { name: 'Lifting eye', pos: [Math.sin(a) * 0.95, TOP + 0.3, Math.cos(a) * 0.95], rot: [Math.PI / 2, 0, a], explode: [0, 1.3, 0], count: 1 })
}
// stack light on the roof
lab.mesh(GEO.disc(0.05, 0.04), steelDark, { name: 'Stack light base', pos: [1.05, TOP + 0.12, -1.0], explode: [0, 0.9, 0] })
const lamps = ['g', 'y', 'r'].map((c, i) => {
  const m = MAT.glow({ emissive: c === 'g' ? [0.1, 1, 0.3] : c === 'y' ? [1, 0.8, 0.1] : [1, 0.15, 0.1], emissiveIntensity: 0.2 })
  lab.mesh(GEO.disc(0.042, 0.07), m, { name: 'Stack light', pos: [1.05, TOP + 0.18 + i * 0.075, -1.0], explode: [0, 0.9, 0], count: 1 })
  return m
})

// ------------------------------------------------------------------ inside: grating floor
lab.mesh(GEO.disc(AP - 0.08, 0.04, 0.005, 8), grating, { name: 'Floor grating', pos: [0, BASE + 0.02, 0], rot: [0, Math.PI / 8, 0] })

// ------------------------------------------------------------------ blast wheels (4), on the side and back walls
const WHEEL_D = 0.48
const wheelAt = [Math.PI / 2, (3 * Math.PI) / 4, (5 * Math.PI) / 4, (3 * Math.PI) / 2]
const wheelY = [1.25, 1.75, 1.75, 1.25].map((y) => BASE + y)
const impellers = []
const bladeGeo = GEO.ring(GEO.rbox(0.2, 0.025, 0.07, 0.006).translate(0.13, 0, 0), 8, 'y')
const S = { n: 0, v: 0, P: 0, k: 0, C: 0, F: 0, live: 4, phase: 'lift' }
wheelAt.forEach((t, i) => {
  const [nx, , nz] = nrm(t), y = wheelY[i]
  const g = new THREE.Group(); g.position.set(nx * AP, y, nz * AP); g.rotation.y = t
  // housing on the outside of the wall, motor behind it, the impeller just inside
  const house = new THREE.Mesh(GEO.rbox(0.62, 0.62, 0.34, 0.04), beigeDark); house.position.z = 0.2
  const motor = new THREE.Mesh(GEO.disc(0.17, 0.44), steel); motor.rotation.x = Math.PI / 2; motor.position.z = 0.6
  const fins = new THREE.Mesh(GEO.ring(GEO.rbox(0.02, 0.4, 0.04, 0.005).translate(0, 0, 0.17), 12, 'y'), steel); fins.rotation.x = Math.PI / 2; fins.position.z = 0.6
  const box = new THREE.Mesh(GEO.rbox(0.14, 0.1, 0.12, 0.02), steelDark); box.position.set(0, 0.2, 0.6)
  const feed = new THREE.Mesh(GEO.pipe([[0, 0.28, 0.2], [0, 0.55, 0.22], [0, 0.8, 0.12]], 0.05), steelDark)
  const wheel = new THREE.Group(); wheel.position.z = -0.08; wheel.rotation.x = Math.PI / 2
  wheel.add(new THREE.Mesh(GEO.disc(WHEEL_D / 2, 0.02), steel), new THREE.Mesh(bladeGeo, MAT.steel({ roughness: 0.35 })))
  g.add(house, motor, fins, box, feed, wheel)
  const first = i === 0
  lab.add(g, { name: `Blast wheel ${i + 1}`, explode: [nx * 1.6, 0, nz * 1.6], count: 14, label: first ? 'Blast wheel' : undefined, at: [0, 0.35, 0.2], value: first ? () => `${fmt(S.n)} rpm · ${fmt(S.v)} m/s` : undefined })
  impellers.push({ wheel, group: g, t, y })
})

// ------------------------------------------------------------------ V-shaped monorail: a leg out through each door, portals, centre post
const RAIL_Z0 = -0.25, RAIL_Z1 = 3.75
const railLen = RAIL_Z1 - RAIL_Z0, railMid = (RAIL_Z0 + RAIL_Z1) / 2
LEGS.forEach((a, i) => {
  const rail = new THREE.Group(); rail.rotation.y = a
  const flangeB = new THREE.Mesh(GEO.rbox(0.16, 0.02, railLen, 0.004), steelDark); flangeB.position.y = RAIL_Y + 0.01
  const web = new THREE.Mesh(GEO.rbox(0.014, 0.2, railLen, 0.003), steelDark); web.position.y = RAIL_Y + 0.12
  const flangeT = new THREE.Mesh(GEO.rbox(0.16, 0.02, railLen, 0.004), steelDark); flangeT.position.y = RAIL_Y + 0.23
  for (const m of [flangeB, web, flangeT]) m.position.z = railMid
  rail.add(flangeB, web, flangeT)
  lab.add(rail, { name: 'Monorail', explode: [Math.sin(a) * 0.3, 0.5, Math.cos(a) * 0.3], count: 3, label: i ? undefined : 'Monorail', at: [0, RAIL_Y + 0.24, 3.4] })
  // outside: a portal frame carries the outer end
  for (const s of [-1, 1]) {
    const [x, z] = W(a, s * 0.62, 3.55)
    lab.mesh(GEO.rbox(0.12, RAIL_Y + 0.38, 0.12, 0.01), yellow, { name: 'Portal column', pos: [x, (RAIL_Y + 0.38) / 2, z], rot: [0, a, 0], explode: [Math.sin(a) * 0.6, 0.3, Math.cos(a) * 0.6] })
    lab.mesh(GEO.rbox(0.26, 0.02, 0.26, 0.004), steelDark, { name: 'Base plate', pos: [x, 0.01, z], rot: [0, a, 0], explode: [Math.sin(a) * 0.6, 0.3, Math.cos(a) * 0.6] })
  }
  const [bx, bz] = W(a, 0, 3.55)
  lab.mesh(GEO.rbox(1.38, 0.14, 0.14, 0.01), yellow, { name: 'Portal beam', pos: [bx, RAIL_Y + 0.31, bz], rot: [0, a, 0], explode: [Math.sin(a) * 0.6, 0.6, Math.cos(a) * 0.6] })
})
// inside: a hanger post from the roof down to where the legs meet, with the switch the trolley turns on
lab.mesh(GEO.rbox(0.12, TOP - RAIL_Y - 0.24, 0.12, 0.01), steelDark, { name: 'Rail hanger post', pos: [0, (TOP + RAIL_Y + 0.24) / 2, 0], explode: [0, 0.5, 0] })
lab.mesh(GEO.disc(0.22, 0.04), steelDark, { name: 'Rail switch', pos: [0, RAIL_Y + 0.26, 0], explode: [0, 0.5, 0] })

// ------------------------------------------------------------------ trolley, hoist, ropes, hook, C-hook hanger, block
const carriage = new THREE.Group() // moves along z
const trolley = new THREE.Mesh(GEO.rbox(0.26, 0.12, 0.34, 0.02), yellow); trolley.position.y = RAIL_Y - 0.08
for (const s of [-1, 1]) for (const z of [-0.11, 0.11]) {
  const w = new THREE.Mesh(GEO.disc(0.045, 0.03), steel); w.rotation.z = Math.PI / 2; w.position.set(s * 0.05, RAIL_Y + 0.045, z); carriage.add(w)
}
const hoistBody = new THREE.Mesh(GEO.rbox(0.36, 0.26, 0.3, 0.04), yellow); hoistBody.position.y = RAIL_Y - 0.28
const drum = new THREE.Mesh(GEO.disc(0.11, 0.42), steel); drum.rotation.z = Math.PI / 2; drum.position.y = RAIL_Y - 0.28
const hoistMotor = new THREE.Mesh(GEO.disc(0.09, 0.2), steelDark); hoistMotor.rotation.z = Math.PI / 2; hoistMotor.position.set(0.3, RAIL_Y - 0.28, 0)
carriage.add(trolley, hoistBody, drum, hoistMotor)
lab.add(carriage, { name: 'Trolley and hoist', explode: [0, 0.6, 0], count: 7, label: 'Hoist', at: [0.2, RAIL_Y - 0.2, 0] })
// ropes are rescaled each frame between the drum and the hook block
const ropeMat = MAT.steel({ roughness: 0.5 })
const ropes = [-0.05, 0.05].map((x) => { const m = new THREE.Mesh(new THREE.CylinderGeometry(0.008, 0.008, 1, 8), ropeMat); m.position.x = x; carriage.add(m); return m })
const hanger = new THREE.Group() // hook block + C-hook + block; lifts with the hoist and turns while blasting
const spin = new THREE.Group(); hanger.add(spin)
const hookBlock = new THREE.Mesh(GEO.rbox(0.16, 0.14, 0.1, 0.02), yellow); hookBlock.position.y = 0.96
const shank = new THREE.Mesh(GEO.disc(0.025, 0.2), steel); shank.position.y = 0.8
const swivel = new THREE.Mesh(GEO.disc(0.06, 0.05), steelDark); swivel.position.y = 0.7
const arm = new THREE.Mesh(GEO.rbox(0.42, 0.06, 0.08, 0.01), steelDark); arm.position.set(-0.18, 0.66, 0)
const back = new THREE.Mesh(GEO.rbox(0.06, 0.66, 0.08, 0.01), steelDark); back.position.set(-0.36, 0.33, 0)
const deck = new THREE.Mesh(GEO.rbox(0.62, 0.04, 0.44, 0.01), steelDark); deck.position.set(-0.04, 0.02, 0)
const tines = [-0.13, 0.13].map((z) => { const m = new THREE.Mesh(GEO.rbox(0.56, 0.03, 0.04, 0.008), steel); m.position.set(-0.04, 0.055, z); return m })
const block = new THREE.Mesh(GEO.rbox(BLOCK[0], BLOCK[1], BLOCK[2], 0.015), blockMat); block.position.set(-0.02, 0.07 + BLOCK[1] / 2, 0)
// four bores on the deck face, so the block reads as an engine block
for (let i = 0; i < 4; i++) { const b = new THREE.Mesh(GEO.tube(0.044, 0.038, 0.012), steelDark); b.position.set(-0.165 + i * 0.11, BLOCK[1] / 2 + 0.003, 0); block.add(b) }
hanger.add(hookBlock)
spin.add(shank, swivel, arm, back, deck, ...tines, block)
lab.add(hanger, { name: 'C-hook hanger', explode: [0, 0, 0], count: 12, label: 'Hanger', at: [-0.36, 0.5, 0], value: () => `coverage ${fmt(S.C * 100, 1)} %` })

// ------------------------------------------------------------------ roller conveyors: in under the left leg, out under the right
const CZ0 = 2.25, CZ1 = 4.45
const rollers = [[], []]
LEGS.forEach((a, i) => {
  const ex = [Math.sin(a) * 0.4, -0.2, Math.cos(a) * 0.4]
  for (const s of [-1, 1]) {
    const [x, z] = W(a, s * 0.38, (CZ0 + CZ1) / 2)
    lab.mesh(GEO.rbox(0.06, 0.12, CZ1 - CZ0, 0.01), steelDark, { name: 'Conveyor rail', pos: [x, CONV_Y - 0.06, z], rot: [0, a, 0], explode: ex, label: s > 0 ? undefined : i ? 'Out: to HSB06' : 'In: from Baritori', at: [0, 0.3, 0.6] })
    for (const zz of [CZ0 + 0.15, CZ1 - 0.15]) { const [lx, lz] = W(a, s * 0.38, zz); lab.mesh(GEO.rbox(0.06, CONV_Y - 0.12, 0.06, 0.01), steelDark, { name: 'Conveyor leg', pos: [lx, (CONV_Y - 0.12) / 2, lz], rot: [0, a, 0], explode: ex, count: 1 }) }
  }
  for (let zz = CZ0 + 0.08; zz < CZ1 - 0.05; zz += 0.11) {
    const [x, z] = W(a, 0, zz)
    const m = lab.mesh(GEO.disc(0.035, 0.7, 0.004, 24), steel, { name: 'Roller', pos: [x, CONV_Y - 0.035, z], rot: [0, a, Math.PI / 2], explode: ex, count: 1 })
    rollers[i].push({ m, q0: m.quaternion.clone() }) // laid across the leg; it spins about its own axis on top of that
  }
})
// the blocks on the conveyors: a raw one rolling in, a blasted one rolling out (hidden by scale: lab-kit sets
// every part's .visible itself each frame)
const shown = (o, on) => o.scale.setScalar(on ? 1 : 1e-4)
function looseBlock(mat) {
  const g = new THREE.Group(); g.add(new THREE.Mesh(GEO.rbox(BLOCK[0], BLOCK[1], BLOCK[2], 0.015), mat))
  for (let i = 0; i < 4; i++) { const b = new THREE.Mesh(GEO.tube(0.044, 0.038, 0.012), steelDark); b.position.set(-0.165 + i * 0.11, BLOCK[1] / 2 + 0.003, 0); g.add(b) }
  return g
}
const rawMat = MAT.castIron({ color: [0.24, 0.2, 0.17], roughness: 0.82 }); rawMat.transparent = true
const doneMat = MAT.castIron({ color: [0.6, 0.6, 0.59], roughness: 0.55 }); doneMat.transparent = true
const inBlock = looseBlock(rawMat), outBlock = looseBlock(doneMat)
lab.add(inBlock, { name: 'Raw block', explode: [-0.5, 0.4, 0.5], count: 5 })
lab.add(outBlock, { name: 'Blasted block', explode: [0.5, 0.4, 0.5], count: 5 })
shown(inBlock, false); shown(outBlock, false)

// ------------------------------------------------------------------ media loop: bucket elevator, shot return, dust collector
lab.mesh(GEO.rbox(0.42, TOP + 0.9, 0.5, 0.02), beigeDark, { name: 'Bucket elevator', pos: [-1.55, (TOP + 0.9) / 2, -1.75], explode: [-0.8, 0, -0.8] })
lab.mesh(GEO.rbox(0.62, 0.42, 0.62, 0.04), beigeDark, { name: 'Elevator head', pos: [-1.55, TOP + 1.05, -1.75], explode: [-0.8, 0.3, -0.8] })
lab.mesh(GEO.pipe([[-1.3, TOP + 1.0, -1.6], [-0.9, TOP + 0.75, -1.1], [-0.55, TOP + 0.4, -0.7]], 0.08), steelDark, { name: 'Shot return chute', explode: [-0.6, 0.6, -0.6] })
lab.mesh(GEO.rbox(0.9, 1.6, 0.9, 0.04), beigeDark, { name: 'Dust collector', pos: [2.4, 1.2, -1.6], explode: [0.9, 0, -0.6] })
lab.mesh(GEO.pipe([[2.2, 2.0, -1.4], [1.9, TOP + 0.55, -1.05], [0.8, TOP + 0.55, -0.6], [0.55, TOP + 0.4, -0.4]], 0.11), steelDark, { name: 'Dust duct', explode: [0.7, 0.6, -0.4] })
for (const [x, z] of [[2.05, -1.95], [2.75, -1.95], [2.05, -1.25], [2.75, -1.25]]) lab.mesh(GEO.rbox(0.08, 0.4, 0.08, 0.01), steelDark, { name: 'Collector leg', pos: [x, 0.2, z], explode: [0.9, 0, -0.6], count: 1 })
lab.mesh(GEO.disc(0.24, 0.3), steel, { name: 'Fan motor', pos: [2.4, 2.15, -1.6], explode: [0.9, 0.3, -0.6] })

// ------------------------------------------------------------------ control panel on the front face, between the two doors
lab.mesh(GEO.rbox(0.42, 0.62, 0.16, 0.03), beigeDark, { name: 'Control panel', pos: [0, BASE + 1.15, AP + 0.11], explode: [0, 0, 0.8], label: 'Control panel', at: [0, 0.4, 0] })
lab.mesh(GEO.disc(0.025, 0.03), MAT.glow({ emissive: [0.1, 1, 0.3], emissiveIntensity: 1.5 }), { name: 'Start button', pos: [-0.09, BASE + 1.05, AP + 0.2], rot: [Math.PI / 2, 0, 0], explode: [0, 0, 0.8], count: 1 })
lab.mesh(GEO.disc(0.035, 0.03), MAT.glow({ emissive: [1, 0.12, 0.08], emissiveIntensity: 1.2 }), { name: 'E-stop', pos: [0.09, BASE + 1.05, AP + 0.2], rot: [Math.PI / 2, 0, 0], explode: [0, 0, 0.8], count: 1 })
lab.mesh(GEO.rbox(0.3, 0.16, 0.01, 0.004), MAT.glow({ emissive: [0.85, 0.9, 1], emissiveIntensity: 0.5 }), { name: 'Panel screen', pos: [0, BASE + 1.3, AP + 0.195], explode: [0, 0, 0.8], count: 1 })

// ------------------------------------------------------------------ shot streams: each wheel throws a fan at the block
const shotPaths = []
wheelAt.forEach((t, i) => {
  const [nx, , nz] = nrm(t), y = wheelY[i]
  const from = [nx * (AP - 0.12), y, nz * (AP - 0.12)]
  const side = [Math.cos(t), 0, -Math.sin(t)]
  for (let k = 0; k < 7; k++) {
    const sx = (k - 3) * 0.06, sy = (((k * 37) % 7) - 3) * 0.05
    const to = [sx * 3 * side[0] - nx * 0.15, BASE + DECK_HIGH + 0.2 + sy, sx * 3 * side[2] - nz * 0.15]
    shotPaths.push([from, [lerp(from[0], to[0], 0.5), lerp(from[1], to[1], 0.5) + 0.04, lerp(from[2], to[2], 0.5)], to])
  }
})
const shot = lab.flow({ paths: shotPaths, count: 900, length: 0.12, speed: 0, color: () => [0.75, 0.74, 0.72] })

// ------------------------------------------------------------------ the solver
const WHEELS = 4
const MDOT = 2.5                     // kg/s shot per wheel
const D_SHOT = 0.84e-3, RHO = 7600   // S330 steel shot
const M_SHOT = RHO * Math.PI * D_SHOT ** 3 / 6
const F_HIT = 0.25, A_BLOCK = 0.92, ETA = 0.6
const BLADE_M = 0.6, BLADE_R = 0.24
const TIME_K = 10                    // the blast phase is shown 10x fast (110 s in 11 s)
function solve(n, live) {
  const v = (Math.PI * WHEEL_D * n) / 60
  const dDent = 0.24e-3 * Math.pow(Math.max(v, 1) / 72, 0.4)
  const k = (F_HIT * ((MDOT * live) / M_SHOT) * (Math.PI * dDent * dDent / 4)) / A_BLOCK
  const P = (MDOT * v * v) / (2 * ETA)
  return { v, k, P }
}

lab.hero({ label: 'Coverage', unit: '%', max: 100, digits: 1 })
const speed = lab.slider({ id: 'rpm', label: 'Blast wheel speed', min: 1800, max: 3000, value: 2900, unit: 'rpm', ends: ['1,800', '3,000'] })

// one cycle, shaped like the Blender animation: pick up at the left door, in, close, blast, open, out through the
// right door, set down on the out conveyor, and back empty for the next block
const CYCLE = [['pickup', 1.6], ['lift', 2.2], ['in', 3.4], ['close', 1.4], ['blast', 11], ['open', 1.4], ['out', 3.4], ['lower', 2.2], ['release', 2.0], ['return', 5.0]]
const CYCLE_LEN = CYCLE.reduce((s, [, d]) => s + d, 0)
const phaseAt = (t) => { let a = t % CYCLE_LEN; for (const [name, d] of CYCLE) { if (a < d) return [name, a / d]; a -= d } return ['return', 1] }
const SAY = { pickup: 'picking up at the left door', lift: 'lifting', in: 'in through the left door', close: 'doors closing', blast: 'blasting', open: 'doors opening', out: 'out through the right door', lower: 'setting down on the out conveyor', release: 'on to HSB06', return: 'back empty for the next block' }
const P_IN = W(LEGS[0], 0, Z_OUT), P_OUT = W(LEGS[1], 0, Z_OUT)
let rollSpin = 0
const spinQ = new THREE.Quaternion(), Y_AXIS = new THREE.Vector3(0, 1, 0)
let clock = 0, simBlast = 0, spinAngle = 0, shake = 0, autoXray = true
// a viewer who presses X-ray takes it over from the cycle
addEventListener('keydown', (e) => { if (e.key === 'x' || e.key === 'X') autoXray = false })
addEventListener('click', (e) => { if (e.target.closest?.('button')?.textContent?.startsWith('X-ray')) autoXray = false }, true)

lab.onTick((dt) => {
  clock += dt
  const [phase, u] = phaseAt(clock)
  S.phase = phase
  const e = smoothstep(0, 1, u)
  // path: 0 = over the in conveyor, 1 = the centre of the chamber, 2 = over the out conveyor
  let p = 0, lift = 1, carry = true, turn = 0
  if (phase === 'pickup') { lift = 1 - e; carry = false }
  else if (phase === 'lift') lift = e
  else if (phase === 'in') p = e
  else if (phase === 'close') p = 1
  else if (phase === 'blast') { p = 1; turn = e }                  // the trolley turns on the switch while it blasts
  else if (phase === 'open') { p = 1; turn = 1 }
  else if (phase === 'out') { p = 1 + e; turn = 1 }
  else if (phase === 'lower') { p = 2; turn = 1; lift = 1 - e }
  else if (phase === 'release') { p = 2; turn = 1; lift = e; carry = false }
  else if (phase === 'return') { p = 2 - 2 * e; turn = smoothstep(0.85, 1.15, p); carry = false }
  const [px, pz] = p <= 1 ? [lerp(P_IN[0], 0, p), lerp(P_IN[1], 0, p)] : [lerp(0, P_OUT[0], p - 1), lerp(0, P_OUT[1], p - 1)]
  const heading = lerp(LEGS[0], LEGS[1], turn)
  const deckY = lerp(DECK_LOW, DECK_HIGH, lift)
  lab.place(carriage, px, 0, pz)
  lab.place(hanger, px, deckY, pz)
  carriage.rotation.y = heading
  hanger.rotation.y = heading
  block.visible = carry
  const top = RAIL_Y - 0.3, bottom = deckY + 1.03
  for (const r of ropes) { r.scale.y = Math.max(0.01, top - bottom); r.position.y = (top + bottom) / 2 }
  // doors: wide open, closed only while blasting
  const open = phase === 'close' ? 1 - e : phase === 'blast' ? 0 : phase === 'open' ? e : 1
  for (const { pivot, s } of leaves) pivot.rotation.y = s * open * 1.75
  // wheels spin up for the blast and coast down after
  const want = phase === 'blast' ? speed.value : 0
  S.n = approach(S.n, want, want > S.n ? 0.9 : 2.2, dt)
  const { v, k, P } = solve(S.n, S.live)
  S.v = v; S.P = P; S.k = k
  // coverage only grows while blasting (dents stay when the wheels coast down): C = 1 - exp(-integral of k dt)
  if (phase === 'blast') { simBlast += dt * TIME_K; S.C = 1 - (1 - S.C) * Math.exp(-k * dt * TIME_K) }
  const omega = (S.n * 2 * Math.PI) / 60
  impellers.forEach(({ wheel }, i) => { if (!(lab.broken && i === 0)) wheel.rotation.y += (omega * dt) / 60 }) // spin shown 1:60
  // the hanger turns slowly while blasting so every face sees the shot
  if (phase === 'blast') spinAngle += dt * 1.6
  else spinAngle = approach(spinAngle, Math.round(spinAngle / (Math.PI * 2)) * Math.PI * 2, 0.5, dt)
  spin.rotation.y = spinAngle
  shot.speed = phase === 'blast' ? v / 55 : 0
  shot.opacity = phase === 'blast' ? clamp((S.n - 600) / 1200) : 0
  // the casting brightens from rust brown to blasted grey with coverage
  blockMat.color.setRGB(lerp(0.24, 0.6, S.C), lerp(0.2, 0.6, S.C), lerp(0.17, 0.59, S.C))
  blockMat.roughness = lerp(0.82, 0.55, S.C)
  // the conveyors: the blasted block rolls on to HSB06 from the out conveyor; a raw one rolls in while the
  // hanger comes back, and the hanger picks it up at the left door
  const [ix, iz] = W(LEGS[0], 0, phase === 'return' ? lerp(CZ1 - 0.2, Z_OUT, e) : Z_OUT)
  lab.place(inBlock, ix, CONV_Y + BLOCK[1] / 2, iz); inBlock.rotation.y = LEGS[0]
  shown(inBlock, phase === 'return' || phase === 'pickup')
  rawMat.opacity = phase === 'return' ? smoothstep(0, 0.25, e) : 1
  if (phase === 'pickup') { simBlast = 0; S.C = 0 }
  const [ox, oz] = W(LEGS[1], 0, phase === 'release' ? lerp(Z_OUT, CZ1 - 0.2, e) : Z_OUT)
  lab.place(outBlock, ox, CONV_Y + BLOCK[1] / 2, oz); outBlock.rotation.y = LEGS[1]
  shown(outBlock, phase === 'release')
  if (phase === 'release') { doneMat.color.copy(blockMat.color); doneMat.opacity = 1 - smoothstep(0.75, 1, u) }
  rollSpin += dt * 8
  spinQ.setFromAxisAngle(Y_AXIS, rollSpin)
  if (phase === 'return') rollers[0].forEach(({ m, q0 }) => m.quaternion.copy(q0).multiply(spinQ))
  if (phase === 'release') rollers[1].forEach(({ m, q0 }) => m.quaternion.copy(q0).multiply(spinQ))
  // while the doors are shut the walls turn to glass, so the blast stays in view
  if (!lab.filmMode && autoXray) lab.target.xray = phase === 'close' || phase === 'blast' || (phase === 'open' && u < 0.6) ? 1 : 0
  // stack light: green ready, yellow moving, red blasting
  lamps[0].emissiveIntensity = phase === 'pickup' || phase === 'lift' ? 3 : 0.2
  lamps[1].emissiveIntensity = ['in', 'out', 'close', 'open', 'lower', 'release', 'return'].includes(phase) ? 3 : 0.2
  lamps[2].emissiveIntensity = phase === 'blast' ? 3 : 0.2
  // after a blade is lost, the tripped wheel shakes as it coasts down
  if (lab.broken) {
    shake = approach(shake, 0, 1.5, dt)
    impellers[0].group.position.y = impellers[0].y + Math.sin(clock * 90) * 0.006 * shake
  }
  lab.setHero(S.C * 100, {
    state: lab.broken ? `wheel 1 tripped · ${SAY[phase]}` : SAY[phase],
    sub: lab.broken
      ? `imbalance ${fmt(S.F / 1000, 1)} kN on wheel 1 · ${S.live} wheels · ${fmt(S.n)} rpm`
      : `${fmt(S.n)} rpm · shot ${fmt(S.v)} m/s · ${fmt(S.P / 1000, 1)} kW per wheel`,
    bad: lab.broken,
  })
})

// ------------------------------------------------------------------ break, explain, film
lab.breakIt({
  label: 'Lose a blade',
  run(lab) {
    const w0 = (speed.value * 2 * Math.PI) / 60
    S.F = BLADE_M * BLADE_R * w0 * w0
    S.live = WHEELS - 1
    shake = 1
    const p = new THREE.Vector3(); impellers[0].wheel.getWorldPosition(p)
    lab.sparks.emit(p, 160, 4)
  },
  reset() { S.live = WHEELS; S.F = 0; shake = 0; impellers[0].group.position.y = impellers[0].y },
})
lab.how(
  'The hoist picks the block up on its C-hook at the left door, carries it in along the monorail and the doors close. Four blast wheels fling S330 steel shot at the block while the C-hook turns it; meanwhile the trolley turns on the switch at the centre, so when the doors open it carries the block out through the right door onto the conveyor to HSB06 and comes back empty for the next one. Shot speed is the wheel tip speed; each impact leaves a dent, and the share of the surface dented grows as 1 - e<sup>-kt</sup> (Avrami). The blast phase is shown 10x fast (110 s in 11 s) and wheel spin 1:60. Losing a blade throws an imbalance load on that wheel; it trips and the other three finish the cycle at three quarters of the rate. Simplified: every wheel lands the same share of its shot on the block, and dent size scales with v<sup>0.4</sup>.',
  [
    'v = pi D n / 60          D = 0.48 m',
    'P = m_dot v^2 / (2 eta)  m_dot = 2.5 kg/s, eta = 0.6',
    'd_dent = 0.24 mm (v / 72)^0.4',
    'k = f_hit (m_dot_tot / m_shot) (pi d_dent^2 / 4) / A_block',
    'C = 1 - exp(-k t)        f_hit = 0.25, A_block = 0.92 m^2',
    'F_imbalance = m_blade r w^2   m = 0.6 kg, r = 0.24 m',
  ],
)
lab.autoFilm({ runBeat: 'It blasts.', runSub: 'Coverage climbs as the shot dents every face.', breakBeat: 'Lose a blade.', breakSub: 'The wheel trips on imbalance; three finish the job.', sliderTo: 0.9 })
// jump to a moment of the cycle (review shots, and a host page that wants a phase)
window.__hsb = { at(t) { clock = t; simBlast = 0; S.C = 0 }, cycle: CYCLE_LEN, get stats() { return { ...S, simBlast } } }
lab.start()
</script>
