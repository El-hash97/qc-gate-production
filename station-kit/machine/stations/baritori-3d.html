<script type="module">
const { THREE, Lab, MAT, GEO, clamp, lerp, approach, fmt, smoothstep } = window.LabKit

// ------------------------------------------------------------------ research (step 1)
// "Baritori: the deburring station at the head of the BC finishing line, moving the way it does in the Blender layout"
// Baritori (バリ取り) removes the casting flash left on the parting line of the cast block before shot blast.
// Dimensions (m), read off the user's Blender layout (1 unit = 0.1 m): timber portal posts 0.14 square,
// 2.36 tall, 1.1 apart, with an air cylinder on the top beam lowering a guard plate; a slide table top at
// 0.40 with two guide rails; a tie-rod pusher cylinder at the far end; roller conveyor top 0.40 towards HSB05;
// push-button box beside the portal; yellow railing behind. BC block 0.475 x 0.336 x 0.371 (L x H x W), 36 kg.
// Parts: table (top, legs, stretchers, rails, end stop, buffers), carriage (bearing blocks, plate, index
// table, cradle, cheeks), block with its flash fin, pusher (caps, barrel, tie rods, bracket, stand, rod),
// portal (posts, feet, guide strips, beam, brackets), lift cylinder, rod, cross bar, guard plate,
// balancer arm, spring balancer, cable, air chisel, conveyor (rails, legs, rollers, stop), button box,
// railing.
// Physics: pusher force F = p A (bore 63 mm); chisel blow energy E = eta p A_h s (bore 19 mm, stroke 50 mm,
// eta 0.45); blow rate f = 30 Hz sqrt(p / 6 bar); flash removed per blow l = E / (e a) with chipping energy
// e = 3 J/mm3 for grey iron and fin section a = 3 x 1.5 mm; rate dL/dt = f l over a 1.69 m parting line;
// free air Q = f A_h s (p + 1 atm) / 1 atm.
// Hero: flash removed, %. Input: line pressure. Break: the supply hose bursts; line pressure bleeds off
// as p e^(-t / tau), the chisel stops and the pusher stalls where it stands.

const lab = new Lab({
  prompt: 'Baritori: the deburring station of the BC line, moving the way it does in the Blender layout',
  no: 4, title: 'Baritori', sub: 'deburring',
  size: 4.6,
  view: { az: 32, el: 16, dist: 1.85, target: [0.15, 1.38, 0.1], fov: 30 },
  cut: { a: [0, 0, 1], b: [0, 1, 0], center: [0.4, 0.7, 0], reach: 0.6 },
  pills: ['three.js', 'Pneumatics', 'Chipping'],
})

// ------------------------------------------------------------------ dimensions
const TABLE_Y = 0.40                          // table top
const TX0 = -1.28, TX1 = 0.98                 // table ends
const RAIL_Z = [-0.18, 0.18]
const LOAD_X = -0.30, WORK_X = 0.42           // carriage stations: under the portal, at the chisel
const SEAT_Y = TABLE_Y + 0.13                 // block base on the cradle
const BLOCK = [0.475, 0.336, 0.371]
const PARTING = 0.22                          // flash fin height above the block base
const POST_Z = 0.55, POST_H = 2.36
const BEAM_Y = POST_H + 0.09
const GUARD_UP = 1.31, GUARD_DOWN = 0.62      // guard plate centre heights
const ROD_Y = 0.62                            // pusher axis
const PUSH_X0 = -1.14                         // pusher bracket face (rod leaves here)
const CONV_X0 = 1.04, CONV_X1 = 2.36, CONV_Y = 0.40

// ------------------------------------------------------------------ materials
const timber = MAT.paint({ color: [0.42, 0.24, 0.13], roughness: 0.78, clearcoat: 0.05 })
const timberDark = MAT.paint({ color: [0.33, 0.19, 0.1], roughness: 0.8, clearcoat: 0.05 })
const yellow = MAT.paint({ color: [0.86, 0.72, 0.1], roughness: 0.36, clearcoat: 0.5 })
const grey = MAT.paint({ color: [0.62, 0.63, 0.62], roughness: 0.45, clearcoat: 0.3 })
const beige = MAT.paint({ color: [0.78, 0.72, 0.6], roughness: 0.45, clearcoat: 0.25 })
const steel = MAT.steel()
const steelDark = MAT.steelDark()
const rubber = MAT.rubber()
const blockMat = MAT.castIron({ color: [0.24, 0.2, 0.17], roughness: 0.8 })
blockMat.transparent = true
const finMat = MAT.castIron({ color: [0.2, 0.17, 0.15], roughness: 0.9 })
finMat.transparent = true

// ------------------------------------------------------------------ slide table
lab.mesh(GEO.rbox(TX1 - TX0, 0.06, 0.76, 0.01), grey, { name: 'Table top', pos: [(TX0 + TX1) / 2, TABLE_Y - 0.03, 0], explode: [0, -0.3, 0], label: 'Slide table', at: [0.7, 0.05, 0.38] })
for (const x of [TX0 + 0.08, TX1 - 0.08]) for (const z of [-0.3, 0.3]) {
  lab.mesh(GEO.rbox(0.06, TABLE_Y - 0.06, 0.06, 0.008), grey, { name: 'Table leg', pos: [x, (TABLE_Y - 0.06) / 2, z], explode: [0, -0.4, 0], count: 1 })
  lab.mesh(GEO.rbox(0.1, 0.015, 0.1, 0.004), steelDark, { name: 'Foot plate', pos: [x, 0.008, z], explode: [0, -0.4, 0], count: 1 })
}
for (const z of [-0.3, 0.3]) lab.mesh(GEO.rbox(TX1 - TX0 - 0.16, 0.04, 0.04, 0.006), grey, { name: 'Stretcher', pos: [(TX0 + TX1) / 2, 0.12, z], explode: [0, -0.4, 0], count: 1 })
for (const z of RAIL_Z) lab.mesh(GEO.rbox(TX1 - TX0 - 0.12, 0.03, 0.04, 0.004), steel, { name: 'Guide rail', pos: [(TX0 + TX1) / 2, TABLE_Y + 0.015, z], explode: [0, -0.15, 0], count: 1 })
lab.mesh(GEO.rbox(0.05, 0.1, 0.6, 0.008), steelDark, { name: 'End stop', pos: [TX1 - 0.055, TABLE_Y + 0.05, 0], explode: [0.3, -0.15, 0] })
for (const z of RAIL_Z) lab.mesh(GEO.disc(0.025, 0.05), rubber, { name: 'Buffer', pos: [TX1 - 0.105, TABLE_Y + 0.065, z], rot: [0, 0, Math.PI / 2], explode: [0.3, -0.15, 0], count: 1 })

// ------------------------------------------------------------------ carriage, index table, cradle, block with its flash
const carriage = new THREE.Group()
for (const dx of [-0.18, 0.18]) for (const z of RAIL_Z) {
  const b = new THREE.Mesh(GEO.rbox(0.12, 0.05, 0.1, 0.008), steelDark); b.position.set(dx, TABLE_Y + 0.055, z); carriage.add(b)
}
const cplate = new THREE.Mesh(GEO.rbox(0.56, 0.04, 0.6, 0.008), grey); cplate.position.y = TABLE_Y + 0.1; carriage.add(cplate)
const turntable = new THREE.Mesh(GEO.disc(0.2, 0.02), steel); turntable.position.y = TABLE_Y + 0.13; carriage.add(turntable)
const cradle = new THREE.Group(); cradle.position.y = SEAT_Y; carriage.add(cradle)
const seat = new THREE.Mesh(GEO.rbox(0.44, 0.012, 0.36, 0.004), steelDark); seat.position.y = -0.006; cradle.add(seat)
for (const s of [-1, 1]) {
  const cheek = new THREE.Mesh(GEO.rbox(0.3, 0.1, 0.03, 0.006), grey); cheek.position.set(0, 0.05, s * 0.205); cradle.add(cheek)
  const boss = new THREE.Mesh(GEO.disc(0.035, 0.03), steelDark); boss.rotation.x = Math.PI / 2; boss.position.set(0, 0.05, s * 0.235); cradle.add(boss)
}
const block = new THREE.Group(); cradle.add(block)
const blockBody = new THREE.Mesh(GEO.rbox(BLOCK[0], BLOCK[1], BLOCK[2], 0.015), blockMat); blockBody.position.y = BLOCK[1] / 2; block.add(blockBody)
for (let i = 0; i < 4; i++) { const b = new THREE.Mesh(GEO.tube(0.044, 0.038, 0.012), steelDark); b.position.set(-0.165 + i * 0.11, BLOCK[1] + 0.003, 0); block.add(b) }
// the flash: a thin fin all round the parting line, cut into segments the chisel takes off one by one
const HX = BLOCK[0] / 2, HZ = BLOCK[2] / 2, FIN = 0.006
const FACES = [ // [start, end] of each face in block coordinates, in the order the chisel works them
  [[-HX, HZ], [HX, HZ]], [[HX, HZ], [HX, -HZ]], [[HX, -HZ], [-HX, -HZ]], [[-HX, -HZ], [-HX, HZ]],
]
const FACE_LEN = FACES.map(([a, b]) => Math.hypot(b[0] - a[0], b[1] - a[1]))
const FACE_END = FACE_LEN.map((_, k) => FACE_LEN.slice(0, k + 1).reduce((s, l) => s + l, 0))
const PERIM = FACE_END[3]
const fins = []
FACES.forEach(([a, b], k) => {
  const n = Math.round(FACE_LEN[k] / 0.02)
  const out = [(b[1] - a[1]) / FACE_LEN[k], -(b[0] - a[0]) / FACE_LEN[k]] // outward normal in (x, z)
  for (let i = 0; i < n; i++) {
    const u = (i + 0.5) / n
    const m = new THREE.Mesh(GEO.rbox((FACE_LEN[k] / n) * 0.96, 0.003, FIN, 0.0008), finMat)
    m.position.set(lerp(a[0], b[0], u) + (out[0] * FIN) / 2, PARTING, lerp(a[1], b[1], u) + (out[1] * FIN) / 2)
    m.rotation.y = Math.atan2(-(b[1] - a[1]), b[0] - a[0])
    block.add(m)
    fins.push({ m, s: FACE_END[k] - FACE_LEN[k] + u * FACE_LEN[k] })
  }
})
lab.add(carriage, { name: 'Carriage and cradle', explode: [0, 0.35, 0], count: 14 + fins.length, label: 'Cradle', at: [0, SEAT_Y + 0.4, 0], value: () => `face ${Math.min(4, S.face + 1)} of 4` })

// ------------------------------------------------------------------ pusher: tie-rod air cylinder at the far end
const PX0 = -2.14
lab.mesh(GEO.rbox(0.08, 0.34, 0.28, 0.008), steelDark, { name: 'Pusher bracket', pos: [TX0 + 0.1, TABLE_Y + 0.17, 0], explode: [-0.3, 0, 0] })
for (const x of [PX0, -1.32]) lab.mesh(GEO.rbox(0.1, 0.2, 0.2, 0.012), steel, { name: 'End cap', pos: [x + 0.05, ROD_Y, 0], explode: [-0.6, 0.2, 0], count: 1 })
lab.mesh(GEO.disc(0.075, 0.72), MAT.steel({ roughness: 0.2 }), { name: 'Pusher barrel', pos: [(PX0 + 0.1 - 1.32) / 2, ROD_Y, 0], rot: [0, 0, Math.PI / 2], explode: [-0.6, 0.2, 0], label: 'Pusher', at: [0, 0.12, 0], value: () => `${fmt(S.F)} N` })
for (const [y, z] of [[0.08, 0.08], [0.08, -0.08], [-0.08, 0.08], [-0.08, -0.08]]) lab.mesh(GEO.disc(0.008, 0.82), steel, { name: 'Tie rod', pos: [(PX0 - 1.22) / 2, ROD_Y + y, z], rot: [0, 0, Math.PI / 2], explode: [-0.6, 0.2, 0], count: 1 })
lab.mesh(GEO.rbox(0.06, ROD_Y - 0.1, 0.06, 0.008), steelDark, { name: 'Rear stand', pos: [PX0 + 0.11, (ROD_Y - 0.1) / 2, 0], explode: [-0.6, -0.1, 0] })
const rod = new THREE.Mesh(new THREE.CylinderGeometry(0.022, 0.022, 1, 24), MAT.chrome())
rod.rotation.z = Math.PI / 2
lab.add(rod, { name: 'Piston rod', explode: [-0.3, 0.2, 0] })
const hoseAt = new THREE.Vector3(PX0 + 0.05, ROD_Y + 0.1, 0.05)

// ------------------------------------------------------------------ timber portal, lift cylinder, guard plate
for (const s of [-1, 1]) {
  lab.mesh(GEO.rbox(0.14, POST_H - 0.03, 0.14, 0.01), timber, { name: 'Timber post', pos: [0, 0.03 + (POST_H - 0.03) / 2, s * POST_Z], explode: [0, 0, s * 0.6], label: s > 0 ? 'Portal' : undefined, at: [0.07, 0.4, 0] })
  lab.mesh(GEO.rbox(0.22, 0.03, 0.22, 0.004), steelDark, { name: 'Post foot', pos: [0, 0.015, s * POST_Z], explode: [0, 0, s * 0.6], count: 1 })
  lab.mesh(GEO.rbox(0.06, 1.3, 0.03, 0.004), steelDark, { name: 'Guide strip', pos: [0, 1.55, s * (POST_Z - 0.085)], explode: [0, 0, s * 0.6], count: 1 })
  lab.mesh(GEO.rbox(0.016, 0.3, 0.18, 0.003), steelDark, { name: 'Beam bracket', pos: [0.078, POST_H - 0.01, s * POST_Z], explode: [0, 0.4, s * 0.6], count: 1 })
}
lab.mesh(GEO.rbox(0.18, 0.18, 1.4, 0.012), timberDark, { name: 'Top beam', pos: [0, BEAM_Y, 0], explode: [0, 0.6, 0] })
lab.mesh(GEO.rbox(0.24, 0.04, 0.24, 0.006), steelDark, { name: 'Cylinder flange', pos: [0, BEAM_Y + 0.11, 0], explode: [0, 0.9, 0] })
for (const y of [BEAM_Y + 0.18, BEAM_Y + 0.78]) lab.mesh(GEO.rbox(0.18, 0.1, 0.18, 0.01), steel, { name: 'Lift end cap', pos: [0, y, 0], explode: [0, 0.9, 0], count: 1 })
lab.mesh(GEO.disc(0.07, 0.5), MAT.steel({ roughness: 0.2 }), { name: 'Lift cylinder', pos: [0, BEAM_Y + 0.48, 0], explode: [0, 0.9, 0], label: 'Lift cylinder', at: [0.1, 0, 0] })
const guard = new THREE.Group()
const crossbar = new THREE.Mesh(GEO.rbox(0.08, 0.08, 0.96, 0.008), steelDark); crossbar.position.y = 0.31; guard.add(crossbar)
const plate = new THREE.Mesh(GEO.rbox(0.03, 0.56, 0.84, 0.006), yellow); plate.position.set(0.065, 0, 0); guard.add(plate)
const lip = new THREE.Mesh(GEO.rbox(0.04, 0.04, 0.8, 0.008), rubber); lip.position.set(0.065, -0.3, 0); guard.add(lip)
const sign = new THREE.Mesh(GEO.rbox(0.004, 0.11, 0.28, 0.002), MAT.paint({ color: [0.1, 0.1, 0.1] })); sign.position.set(0.082, 0.08, 0); guard.add(sign)
lab.add(guard, { name: 'Guard plate', explode: [0.4, 0, 0], count: 4, label: 'Guard', at: [0.08, 0.2, 0.3] })
const liftRod = new THREE.Mesh(new THREE.CylinderGeometry(0.022, 0.022, 1, 20), MAT.chrome())
lab.add(liftRod, { name: 'Lift rod', explode: [0, 0.9, 0] })

// ------------------------------------------------------------------ balancer arm, spring balancer, air chisel
const ARM_Z = 0.36
lab.mesh(GEO.rbox(0.62, 0.06, 0.06, 0.006), steelDark, { name: 'Balancer arm', pos: [0.39, BEAM_Y, ARM_Z], explode: [0.3, 0.6, 0.3] })
lab.mesh(GEO.disc(0.07, 0.09), yellow, { name: 'Spring balancer', pos: [WORK_X, BEAM_Y - 0.13, ARM_Z], rot: [Math.PI / 2, 0, 0], explode: [0.3, 0.6, 0.3], label: 'Balancer', at: [0.08, 0, 0] })
const cable = new THREE.Mesh(new THREE.CylinderGeometry(0.004, 0.004, 1, 8), steel)
lab.add(cable, { name: 'Balancer cable', explode: [0.3, 0.3, 0.3] })
const chisel = new THREE.Group() // origin at the bit's tip, the tool points along -z
const bit = new THREE.Mesh(GEO.disc(0.008, 0.06), MAT.steel({ roughness: 0.25 })); bit.rotation.x = Math.PI / 2; bit.position.z = 0.03
const body = new THREE.Mesh(GEO.disc(0.028, 0.2), steelDark); body.rotation.x = Math.PI / 2; body.position.z = 0.16
const grip = new THREE.Mesh(GEO.rbox(0.04, 0.14, 0.05, 0.012), rubber); grip.position.set(0, -0.06, 0.24)
const trigger = new THREE.Mesh(GEO.rbox(0.02, 0.03, 0.02, 0.004), MAT.paint({ color: [0.8, 0.12, 0.1] })); trigger.position.set(0, -0.03, 0.205)
const eye = new THREE.Mesh(GEO.tube(0.016, 0.009, 0.01), steel); eye.rotation.x = Math.PI / 2; eye.position.set(0, 0.04, 0.2)
chisel.add(bit, body, grip, trigger, eye)
lab.add(chisel, { name: 'Air chisel', explode: [0, 0.2, 0.5], count: 5, label: 'Air chisel', at: [0, 0.05, 0.16], value: () => `${fmt(S.f)} blows/s · ${fmt(S.E, 1)} J` })
const chips = lab.flow({
  parent: chisel,
  paths: Array.from({ length: 14 }, (_, i) => {
    const a = (i / 14) * Math.PI - Math.PI / 2, r = 0.05 + (i % 3) * 0.02
    return [[0, 0, 0.005], [Math.sin(a) * r, 0.02, 0.05], [Math.sin(a) * r * 2.2, -0.12, 0.12 + (i % 4) * 0.02]]
  }),
  count: 260, length: 0.18, speed: 0, color: () => [0.35, 0.33, 0.31],
})

// ------------------------------------------------------------------ roller conveyor towards HSB05
for (const s of [-1, 1]) {
  lab.mesh(GEO.rbox(CONV_X1 - CONV_X0, 0.09, 0.04, 0.006), steelDark, { name: 'Conveyor rail', pos: [(CONV_X0 + CONV_X1) / 2, CONV_Y - 0.035, s * 0.34], explode: [0.4, -0.2, 0], count: 1 })
  for (const x of [CONV_X0 + 0.1, CONV_X1 - 0.1]) lab.mesh(GEO.rbox(0.04, CONV_Y - 0.08, 0.04, 0.006), steelDark, { name: 'Conveyor leg', pos: [x, (CONV_Y - 0.08) / 2, s * 0.34], explode: [0.4, -0.2, 0], count: 1 })
}
lab.mesh(GEO.rbox(0.04, 0.16, 0.72, 0.006), steelDark, { name: 'Conveyor stop', pos: [CONV_X1 + 0.02, CONV_Y, 0], explode: [0.6, -0.2, 0] })
const rollers = []
for (let i = 0, x = CONV_X0 + 0.06; x < CONV_X1 - 0.03; i++, x += 0.07) rollers.push(lab.mesh(GEO.disc(0.023, 0.64, 0.003, 24), steel, { name: 'Roller', pos: [x, CONV_Y - 0.023, 0], rot: [Math.PI / 2, 0, 0], explode: [0.4, -0.2, 0], count: 1, label: i === 4 ? 'To HSB05' : undefined, at: [0, 0.05, 0] }))

// ------------------------------------------------------------------ push-button box and the railing
lab.mesh(GEO.rbox(0.06, 0.8, 0.06, 0.006), steelDark, { name: 'Box pedestal', pos: [-0.64, 0.42, 0.7], explode: [0, 0, 0.5] })
lab.mesh(GEO.rbox(0.16, 0.02, 0.16, 0.004), steelDark, { name: 'Pedestal foot', pos: [-0.64, 0.01, 0.7], explode: [0, 0, 0.5] })
lab.mesh(GEO.rbox(0.32, 0.42, 0.16, 0.02), beige, { name: 'Button box', pos: [-0.64, 1.03, 0.7], explode: [0, 0, 0.5], label: 'Push buttons', at: [0, 0.22, 0.08] })
const btnGeo = GEO.disc(0.012, 0.012)
const btnOff = MAT.plastic({ color: [0.12, 0.12, 0.13] })
const btn = MAT.glow({ emissive: [0.1, 1, 0.3], emissiveIntensity: 0.3 })
for (let r = 0; r < 4; r++) for (let c = 0; c < 5; c++) lab.mesh(btnGeo, r === 0 && c === 0 ? btn : btnOff, { name: 'Push button', pos: [-0.74 + c * 0.05, 1.13 - r * 0.065, 0.785], rot: [Math.PI / 2, 0, 0], explode: [0, 0, 0.5], count: 1 })
lab.mesh(GEO.disc(0.035, 0.03), MAT.glow({ emissive: [1, 0.12, 0.08], emissiveIntensity: 1.2 }), { name: 'E-stop', pos: [-0.56, 1.26, 0.7], explode: [0, 0.2, 0.5] })
const RAIL_XS = [-2.0, -1.4, -0.8, -0.2, 0.4, 1.0, 1.6, 2.2]
for (const x of RAIL_XS) lab.mesh(GEO.rbox(0.04, 1.0, 0.04, 0.006), yellow, { name: 'Railing post', pos: [x, 0.5, -0.86], explode: [0, 0, -0.5], count: 1 })
for (const y of [0.54, 0.98]) lab.mesh(GEO.rbox(RAIL_XS.at(-1) - RAIL_XS[0] + 0.04, 0.04, 0.04, 0.008), yellow, { name: 'Railing bar', pos: [(RAIL_XS[0] + RAIL_XS.at(-1)) / 2, y, -0.86], explode: [0, 0, -0.5], count: 1 })

// ------------------------------------------------------------------ the solver
const BAR = 1e5, ATM = 1.013e5
const A_PUSH = Math.PI * 0.0315 ** 2          // 63 mm bore
const A_HAM = Math.PI * 0.0095 ** 2           // 19 mm bore
const STROKE_H = 0.05, ETA = 0.45
const E_CHIP = 3e9                            // J/m3, grey iron
const A_FIN = 3e-3 * 1.5e-3                   // fin section, m2
const TIME_K = 12                             // the chipping is shown 12x fast
const S = { p: 6 * BAR, F: 0, f: 0, E: 0, rate: 0, Q: 0, removed: 0, face: 0 }
function solve(p) {
  const F = p * A_PUSH
  const f = p > 0.5 * BAR ? 30 * Math.sqrt(p / (6 * BAR)) : 0
  const E = ETA * p * A_HAM * STROKE_H
  const rate = (f * E) / (E_CHIP * A_FIN)     // m of flash per second
  const Q = ((f * A_HAM * STROKE_H * (p + ATM)) / ATM) * 60e3 // free air, L/min
  return { F, f, E, rate, Q }
}

lab.hero({ label: 'Flash removed', unit: '%', max: 100, digits: 0 })
const pressure = lab.slider({ id: 'bar', label: 'Line pressure', min: 4, max: 7, value: 6, unit: 'bar', ends: ['4', '7'] })

// one cycle, shaped like the Blender animation: load, push in, guard down, chip four faces, guard up, hand on, back
const DUR = { load: 1.6, in: 2.2, guard: 1.2, turn: 0.9, raise: 1.2, index: 2.4, back: 2.2 }
const NEXT = { load: 'in', in: 'guard', guard: 'deburr', raise: 'index', index: 'back', back: 'load' }
const SAY = { load: 'loading', in: 'pushing in', guard: 'guard down', deburr: 'chipping the flash', turn: 'indexing 90°', raise: 'guard up', index: 'to HSB05', back: 'carriage back' }
let phase = 'load', pt = 0, clock = 0, turnFrom = 0, airLost = false
const turnTo = () => (-Math.PI / 2) * S.face
const setPhase = (p) => { phase = p; pt = 0 }
const chiselAt = [WORK_X, SEAT_Y + PARTING + 0.12, 0.42]

lab.onTick((dt) => {
  clock += dt
  // line pressure follows the slider, or bleeds off after the hose bursts
  S.p = airLost ? approach(S.p, 0, 0.4, dt) : approach(S.p, pressure.value * BAR, 0.3, dt)
  const live = S.p > 2 * BAR // below 2 bar nothing pneumatic moves
  const sol = solve(S.p)
  S.F = sol.F; S.E = sol.E; S.rate = sol.rate
  S.f = phase === 'deburr' ? sol.f : approach(S.f, 0, 0.1, dt)
  S.Q = phase === 'deburr' ? sol.Q : 0
  if (live) pt += dt
  const u = DUR[phase] ? clamp(pt / DUR[phase]) : 0
  const e = smoothstep(0, 1, u)

  // carriage position along the table, piston rod from the bracket to the carriage
  let cx = LOAD_X
  if (phase === 'in') cx = lerp(LOAD_X, WORK_X, e)
  else if (['guard', 'deburr', 'turn', 'raise', 'index'].includes(phase)) cx = WORK_X
  else if (phase === 'back') cx = lerp(WORK_X, LOAD_X, e)
  lab.place(carriage, cx, 0, 0)
  const rodEnd = cx - 0.28
  rod.scale.y = Math.max(0.01, rodEnd - PUSH_X0); rod.position.set((rodEnd + PUSH_X0) / 2, ROD_Y, 0)

  // guard plate and the lift rod above it
  const down = phase === 'guard' ? e : ['deburr', 'turn'].includes(phase) ? 1 : phase === 'raise' ? 1 - e : 0
  const gy = lerp(GUARD_UP, GUARD_DOWN, down)
  lab.place(guard, 0, gy, 0)
  const rTop = BEAM_Y + 0.13, rBot = gy + 0.35
  liftRod.scale.y = Math.max(0.01, rTop - rBot); liftRod.position.set(0, (rTop + rBot) / 2, 0)

  // chipping: the flash comes off at the solver's rate, one face at a time; the cradle indexes 90° between faces
  if (phase === 'deburr' && live) {
    S.removed = Math.min(FACE_END[S.face], S.removed + S.rate * TIME_K * dt)
    if (S.removed >= FACE_END[S.face] - 1e-6) {
      S.face++
      if (S.face >= 4) setPhase('raise')
      else { turnFrom = cradle.rotation.y; setPhase('turn') }
    }
  } else if (phase === 'turn') {
    cradle.rotation.y = lerp(turnFrom, turnTo(), e)
    if (u >= 1) setPhase('deburr')
  } else if (phase !== 'deburr' && u >= 1) {
    if (phase === 'raise') cradle.rotation.y = 0 // four quarter turns: square again
    if (phase === 'back') { S.removed = 0; S.face = 0 }
    setPhase(NEXT[phase])
  }
  for (const { m, s } of fins) m.visible = s > S.removed

  // the chisel: parked under its balancer, or on the parting line of the face that looks at the operator
  const k = Math.min(S.face, 3)
  const half = FACE_LEN[k] / 2, depth = k % 2 ? HX : HZ
  const along = clamp((S.removed - (FACE_END[k] - FACE_LEN[k])) / FACE_LEN[k])
  const working = phase === 'deburr'
  const target = working ? [cx + lerp(-half, half, along), SEAT_Y + PARTING, depth + FIN + 0.002] : [WORK_X, SEAT_Y + PARTING + 0.12, 0.42]
  for (let i = 0; i < 3; i++) chiselAt[i] = approach(chiselAt[i], target[i], working ? 0.06 : 0.25, dt)
  const buzz = working && live ? Math.sin(clock * S.f * 2 * Math.PI) * 0.0015 : 0
  lab.place(chisel, chiselAt[0], chiselAt[1], chiselAt[2] + buzz)
  // balancer cable from the drum to the chisel's eye
  const a = new THREE.Vector3(WORK_X, BEAM_Y - 0.18, ARM_Z), b = new THREE.Vector3(chiselAt[0], chiselAt[1] + 0.05, chiselAt[2] + 0.2)
  const dir = b.clone().sub(a)
  cable.scale.y = Math.max(0.01, dir.length())
  cable.position.copy(a).add(b).multiplyScalar(0.5)
  cable.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.normalize())
  chips.speed = working && live ? 1.6 : 0
  chips.opacity = working && live ? clamp(S.f / 20) : 0

  // the casting goes from raw brown to clean grey as the flash comes off
  const C = S.removed / PERIM
  blockMat.color.setRGB(lerp(0.24, 0.42, C), lerp(0.2, 0.4, C), lerp(0.17, 0.38, C))
  // hand-on: the block slides off the cradle onto the rollers and away; a raw one is loaded at the start
  if (phase === 'index') {
    block.position.x = smoothstep(0, 0.6, u) * 0.95
    block.position.y = smoothstep(0.2, 0.6, u) * (CONV_Y - SEAT_Y)
    blockMat.opacity = finMat.opacity = u < 0.6 ? 1 : 1 - (u - 0.6) / 0.4
    rollers.forEach((r) => { r.rotation.y += dt * 8 })
  } else if (phase === 'back' || phase === 'load') {
    block.position.set(0, 0, 0)
    blockMat.opacity = finMat.opacity = phase === 'load' ? u : 0
  } else blockMat.opacity = finMat.opacity = 1
  btn.emissiveIntensity = phase === 'load' ? 3 : 0.3

  lab.setHero(C * 100, {
    state: airLost ? `air lost · ${SAY[phase]}` : SAY[phase],
    sub: airLost
      ? `line ${fmt(S.p / BAR, 1)} bar · chisel ${live ? 'slowing' : 'stopped'} · pusher stalled`
      : `${fmt(S.p / BAR, 1)} bar · ${fmt(S.f)} blows/s · ${fmt(S.E, 1)} J per blow · ${fmt(S.rate * 1000, 1)} mm/s · ${fmt(S.Q)} L/min`,
    bad: airLost,
  })
})

// ------------------------------------------------------------------ break, explain, film
lab.breakIt({
  label: 'Burst the hose',
  run(lab) {
    airLost = true
    lab.sparks.emit(lab.machine.localToWorld(hoseAt.clone()), 60, 2)
  },
  reset() { airLost = false },
})
lab.how(
  'A tie-rod cylinder pushes the carriage through the timber portal, the guard drops, and an air chisel hung on a spring balancer chips the casting flash off the parting line, face by face, while the cradle indexes the block 90° between faces. Each blow carries the piston energy, and the flash it takes off is that energy over the chipping energy of grey iron times the fin section. The chipping is shown 12x fast. Bursting the supply hose bleeds the line pressure away; below 2 bar the pusher stalls where it stands and the chisel stops. Simplified: every blow lands on the fin, and the fin has one section all round.',
  [
    'F = p A               A = pi (0.063/2)^2',
    'E = eta p A_h s       A_h = pi (0.019/2)^2, s = 50 mm, eta = 0.45',
    'f = 30 Hz sqrt(p / 6 bar)',
    'l = E / (e a)         e = 3 J/mm^3, a = 3 x 1.5 mm',
    'dL/dt = f l           L = 2 (0.475 + 0.371) m',
    'Q = f A_h s (p + 1 atm) / 1 atm',
  ],
)
lab.autoFilm({ runBeat: 'It chips.', runSub: 'The flash comes off the parting line, one face at a time.', breakBeat: 'Burst the hose.', breakSub: 'The pressure bleeds off; the chisel and the pusher stop.', sliderTo: 0.9 })
// jump to a phase for review shots: __bari.go('deburr', 0.4) starts chipping with 40 % of the flash gone
window.__bari = {
  go(p, frac = 0) {
    S.removed = PERIM * frac
    S.face = Math.min(3, FACE_END.findIndex((end) => S.removed < end - 1e-6) === -1 ? 3 : FACE_END.findIndex((end) => S.removed < end - 1e-6))
    cradle.rotation.y = p === 'deburr' || p === 'turn' ? turnTo() : 0
    setPhase(p)
  },
}
lab.start()
</script>
